{% load static %}

{% if form.errors %}
<ul>
  {% for field in form %}
    {% for error in field.errors %}
      <li><strong>{{ field.label }}:</strong>{{ error }}</li>
    {% endfor %}
  {% endfor %}
</ul>
{% endif %}

{% for field in form %}
<div>
  {{ field.label_tag }}
  {{ field }}
</div>
{% endfor %}

<button type="submit" class="submit-btn">保存する</button>
