{% if matrix %}
<div class="vote-section matrix-section">
  <h3 class="vote-section__title">2軸マトリクス</h3>
  <p class="matrix-section__note">投稿者・管理職のみ表示</p>

  <div class="matrix-wrap">
    <!-- Y軸ラベル -->
    <div class="matrix-y-label">
      <span class="matrix-axis-label matrix-axis-label--top">共感率 高</span>
      <span class="matrix-axis-label matrix-axis-label--bottom">共感率 低</span>
    </div>

    <!-- グリッド本体 -->
    <div class="matrix-grid">
      <!-- 4象限ラベル -->
      <div class="matrix-quadrant matrix-quadrant--tl
        {% if matrix.quadrant == 'rethink_solution' %}matrix-quadrant--active{% endif %}">
        解決策を<br>練り直す
      </div>
      <div class="matrix-quadrant matrix-quadrant--tr
        {% if matrix.quadrant == 'immediate' %}matrix-quadrant--active{% endif %}">
        即推進
      </div>
      <div class="matrix-quadrant matrix-quadrant--bl
        {% if matrix.quadrant == 'hold' %}matrix-quadrant--active{% endif %}">
        保留 / 棄却
      </div>
      <div class="matrix-quadrant matrix-quadrant--br
        {% if matrix.quadrant == 'refine_idea' %}matrix-quadrant--active{% endif %}">
        アイデアを<br>磨き直す
      </div>

      <!-- 閾値線 -->
      <div class="matrix-line matrix-line--v"></div>
      <div class="matrix-line matrix-line--h"></div>

      <!-- プロット点 -->
      <div class="matrix-dot
        matrix-dot--{{ matrix.quadrant }}"
        style="left: {{ matrix.x_pct }}%; bottom: {{ matrix.y_pct }}%;"
        title="{{ matrix.label }}">
      </div>
    </div>

    <!-- X軸ラベル -->
    <div class="matrix-x-label">
      <span class="matrix-axis-label">課題スコア 低</span>
      <span class="matrix-axis-label">課題スコア 高</span>
    </div>
  </div>

  <!-- 現在地 -->
  <div class="matrix-result matrix-result--{{ matrix.quadrant }}">
    <p class="matrix-result__label">現在地：<strong>{{ matrix.label }}</strong></p>
    <p class="matrix-result__values">
      共感率 {{ matrix.sympathy_rate }}%　／　課題スコア平均 {{ matrix.pain_avg }}
    </p>
    <p class="matrix-result__action">&#128204; {{ matrix.action }}</p>
  </div>
</div>
{% endif %}
