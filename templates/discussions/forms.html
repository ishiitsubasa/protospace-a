{% load static %}

<div class="form-wrapper">
  <h2>議題を作成する</h2>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="field">
      {{ field.label_tag }}
      {{ field }}
      {% if field.errors %}
      <ul class="errorlist">
        {% for error in field.errors %}
        <li>{{ error }}</li>
        {% endfor %}
      </ul>
      {% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="submit-btn">作成する</button>
  </form>
</div>
